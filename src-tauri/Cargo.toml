[package]
name = "anser"
version = "0.1.34"
edition = "2021"
license-file = "../LICENSE"
[lib]
name = "anser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
mailparse = "0.16"
encoding_rs = "0.8"
cssparser = "0.37"
scraper = { version = "0.24", default-features = false }
imap = "2.4"
imap-proto = "0.10.2"
native-tls = "0.2"
lettre = "0.11"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", features = ["blocking", "json", "socks"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-native-tls = "0.3"
base64 = "0.22"
url = "2"
open = "5"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
fs2 = "0.4.3"
libc = "0.2"
msg_parser = "=0.3.6"
cfb = "0.14"
aes-gcm = "0.10"
getrandom = "0.2"
[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-deep-link = "2"
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_System_WinRT"] }

# Avoid LLVM's Mach-O strip misalignment on macOS 27.
# https://github.com/rust-lang/rust/issues/157750
[profile.release]
strip = "none"
[profile.release.build-override]
strip = "none"

[patch.crates-io]
imap-proto = { path = "vendor/imap-proto" }
