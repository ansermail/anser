name: Verify macOS signing
on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
    paths:
      - "scripts/mac-*-signing*"
      - "scripts/signing/**"
      - "src-tauri/src/credentials.rs"
      - ".github/workflows/signing-check.yml"
permissions:
  contents: read
concurrency:
  group: signing-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: signing-${{ matrix.target }}
      - run: npm ci
      - name: Import fixed project certificate
        env:
          ANSER_CODESIGN_P12_BASE64: ${{ secrets.ANSER_CODESIGN_P12_BASE64 }}
          ANSER_CODESIGN_P12_PASSWORD: ${{ secrets.ANSER_CODESIGN_P12_PASSWORD }}
        run: node scripts/mac-ci-signing.mjs import
      - name: Build verification app (no release)
        env:
          MAIL_GOOGLE_CLIENT_ID: ${{ secrets.MAIL_GOOGLE_CLIENT_ID }}
          MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIL_GOOGLE_CLIENT_SECRET }}
          MAIL_MICROSOFT_CLIENT_ID: ${{ secrets.MAIL_MICROSOFT_CLIENT_ID }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("anser-signing.config.json")); c.bundle.createUpdaterArtifacts=false; fs.writeFileSync("anser-signing.config.json",JSON.stringify(c));'
          npm run tauri -- build --target ${{ matrix.target }} --bundles app --config anser-signing.config.json
          node scripts/mac-ci-signing.mjs verify "src-tauri/target/${{ matrix.target }}/release/bundle/macos/雁信.app"
      - name: Remove temporary signing keychain
        if: always()
        run: node scripts/mac-ci-signing.mjs cleanup
      - name: Archive verification app
        run: ditto -c -k --keepParent "src-tauri/target/${{ matrix.target }}/release/bundle/macos/雁信.app" "anser-signing-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: signing-${{ matrix.target }}
          path: anser-signing-*.zip
          retention-days: 7
          if-no-files-found: error
