name: Preview Pages
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "preview/**"
      - "vite.config.ts"
      - "package*.json"
      - ".github/workflows/preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build:preview
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-preview
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static preview
        id: deployment
        uses: actions/deploy-pages@v4
