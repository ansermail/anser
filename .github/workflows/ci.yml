name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: pnpm test:ci
      - run: pnpm test:desktop
      - run: pnpm build
      - run: pnpm test:rust
      - run: cargo test --manifest-path src-tauri/vendor/imap-proto/Cargo.toml
