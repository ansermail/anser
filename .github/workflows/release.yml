name: Release macOS
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: macos-14
    outputs:
      build_required: ${{ steps.release.outputs.build_required }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - id: release
        name: Skip versions already published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if gh release view "v$VERSION" --json isDraft --jq .isDraft > /tmp/release-state 2>/dev/null && test "$(cat /tmp/release-state)" = false; then
            echo "build_required=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already published; skipping without replacing its assets."
          else
            echo "build_required=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node scripts/release-assets.mjs verify
      - run: npm run format:check && cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Frontend tests
        run: npm test
      - name: Desktop script tests
        run: npm run test:desktop
      - name: Production frontend build
        run: npm run build
      - name: Rust tests
        run: npm run test:rust
      - name: IMAP parser tests
        run: cargo test --manifest-path src-tauri/vendor/imap-proto/Cargo.toml
  build:
    needs: check
    if: needs.check.outputs.build_required == 'true'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
      - run: npm ci
      - name: Require updater signing key
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$SIGNING_KEY" || { echo 'Missing TAURI_SIGNING_PRIVATE_KEY'; exit 1; }
      - name: Build signed update and first-install DMG
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target ${{ matrix.target }} --bundles app,dmg
          uploadUpdaterJson: false
      - name: Verify complete macOS app signature
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          APP="src-tauri/target/$BUILD_TARGET/release/bundle/macos/雁信.app"
          test -s "$APP/Contents/_CodeSignature/CodeResources"
          codesign --verify --strict --deep "$APP"
          test -s "$APP/Contents/Resources/LICENSE"
          test -s "$APP/Contents/Resources/NOTICE"
          test -s "$APP/Contents/Resources/LICENSING.md"
          test -s "$APP/Contents/Resources/licenses/shadcn-ui-MIT.txt"
      - run: node scripts/release-assets.mjs collect ${{ matrix.target }} release-assets
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - run: node scripts/release-assets.mjs manifest release-assets
      - name: Create or update draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            test "$DRAFT" = true || { echo 'Published releases are immutable; bump the version.'; exit 1; }
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Anser - 雁信 $VERSION" --notes-file "docs/releases/$TAG.md"
          fi
          gh release upload "$TAG" release-assets/*.dmg release-assets/*.tar.gz release-assets/*.sig release-assets/latest.json --clobber
