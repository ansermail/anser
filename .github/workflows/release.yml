name: Release desktop
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-desktop
  cancel-in-progress: false
jobs:
  check:
    runs-on: macos-14
    outputs:
      build_required: ${{ steps.release.outputs.build_required }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - id: release
        name: Skip versions already published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-draft.mjs check
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node scripts/release-assets.mjs verify
      - run: npm run format:check && cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Frontend tests
        run: npm test
      - name: Desktop script tests
        run: npm run test:desktop
      - name: Production frontend build
        run: npm run build
      - name: Rust tests
        run: npm run test:rust
      - name: IMAP parser tests
        run: cargo test --manifest-path src-tauri/vendor/imap-proto/Cargo.toml
  build:
    needs: check
    if: needs.check.outputs.build_required == 'true'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
      - run: npm ci
      - name: Require updater signing key
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$SIGNING_KEY" || { echo 'Missing TAURI_SIGNING_PRIVATE_KEY'; exit 1; }
      - name: Require desktop OAuth configuration
        env:
          MAIL_GOOGLE_CLIENT_ID: ${{ secrets.MAIL_GOOGLE_CLIENT_ID }}
          MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIL_GOOGLE_CLIENT_SECRET }}
          MAIL_MICROSOFT_CLIENT_ID: ${{ secrets.MAIL_MICROSOFT_CLIENT_ID }}
        run: |
          test -n "$MAIL_GOOGLE_CLIENT_ID" || { echo 'Missing MAIL_GOOGLE_CLIENT_ID'; exit 1; }
          test -n "$MAIL_GOOGLE_CLIENT_SECRET" || { echo 'Missing MAIL_GOOGLE_CLIENT_SECRET'; exit 1; }
          test -n "$MAIL_MICROSOFT_CLIENT_ID" || { echo 'Missing MAIL_MICROSOFT_CLIENT_ID'; exit 1; }
      - name: Import fixed project signing certificate
        env:
          ANSER_CODESIGN_P12_BASE64: ${{ secrets.ANSER_CODESIGN_P12_BASE64 }}
          ANSER_CODESIGN_P12_PASSWORD: ${{ secrets.ANSER_CODESIGN_P12_PASSWORD }}
        run: node scripts/mac-ci-signing.mjs import
      - name: Build signed update and first-install DMG
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          MAIL_GOOGLE_CLIENT_ID: ${{ secrets.MAIL_GOOGLE_CLIENT_ID }}
          MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIL_GOOGLE_CLIENT_SECRET }}
          MAIL_MICROSOFT_CLIENT_ID: ${{ secrets.MAIL_MICROSOFT_CLIENT_ID }}
        with:
          args: --target ${{ matrix.target }} --bundles app,dmg --config anser-signing.config.json
          uploadUpdaterJson: false
      - name: Verify complete macOS app signature
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          APP="src-tauri/target/$BUILD_TARGET/release/bundle/macos/雁信.app"
          test -s "$APP/Contents/_CodeSignature/CodeResources"
          node scripts/mac-ci-signing.mjs verify "$APP"
          test -s "$APP/Contents/Resources/LICENSE"
          test -s "$APP/Contents/Resources/NOTICE"
          test -s "$APP/Contents/Resources/LICENSING.md"
          test -s "$APP/Contents/Resources/licenses/shadcn-ui-MIT.txt"
      - name: Remove temporary signing keychain
        if: always()
        run: node scripts/mac-ci-signing.mjs cleanup
      - run: node scripts/release-assets.mjs collect ${{ matrix.target }} release-assets
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  build-windows:
    needs: check
    if: needs.check.outputs.build_required == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-windows-x64
          cache-on-failure: true
      - run: npm ci
      - name: Windows native regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Require signing and desktop OAuth configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MAIL_GOOGLE_CLIENT_ID: ${{ secrets.MAIL_GOOGLE_CLIENT_ID }}
          MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIL_GOOGLE_CLIENT_SECRET }}
          MAIL_MICROSOFT_CLIENT_ID: ${{ secrets.MAIL_MICROSOFT_CLIENT_ID }}
        run: node -e "for (const k of ['TAURI_SIGNING_PRIVATE_KEY','MAIL_GOOGLE_CLIENT_ID','MAIL_GOOGLE_CLIENT_SECRET','MAIL_MICROSOFT_CLIENT_ID']) if (!process.env[k]) throw new Error('Missing ' + k)"
      - name: Build Windows installer and signed update
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          MAIL_GOOGLE_CLIENT_ID: ${{ secrets.MAIL_GOOGLE_CLIENT_ID }}
          MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIL_GOOGLE_CLIENT_SECRET }}
          MAIL_MICROSOFT_CLIENT_ID: ${{ secrets.MAIL_MICROSOFT_CLIENT_ID }}
        with:
          args: --target x86_64-pc-windows-msvc --bundles nsis
          uploadUpdaterJson: false
      - name: Install and start the WebView2 client
        run: ./scripts/windows-smoke.ps1
      - run: node scripts/release-assets.mjs collect x86_64-pc-windows-msvc release-assets
      - uses: actions/upload-artifact@v6
        with:
          name: release-x86_64-pc-windows-msvc
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: [build, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - run: node scripts/release-assets.mjs manifest release-assets
      - name: Create or update draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-draft.mjs upload release-assets
