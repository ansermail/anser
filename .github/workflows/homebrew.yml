name: Update Homebrew Cask
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published latest tag (empty selects latest)"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: homebrew-cask
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'ansermail/anser' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test release selection and integrity guards
        run: node --test scripts/homebrew.node-test.mjs
      - name: Verify public DMGs and generate cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node scripts/homebrew.mjs generate
      - name: Validate cask with Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew tap --custom-remote ansermail/tap "$GITHUB_WORKSPACE"
          cp Casks/anser.rb "$(brew --repository ansermail/tap)/Casks/anser.rb"
          brew style --cask ansermail/tap/anser
          brew audit --cask ansermail/tap/anser
          brew fetch --cask ansermail/tap/anser
      - name: Recheck latest and commit only the cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node scripts/homebrew.mjs publish
