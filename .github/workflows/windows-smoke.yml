name: Windows installer smoke
on:
  workflow_dispatch:
    inputs:
      installer_run_id:
        description: Successful installer artifact source run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8.0.1
        with:
          name: Anser-Windows-x64-validation-installer
          run-id: ${{ inputs.installer_run_id }}
          github-token: ${{ github.token }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
      - run: ./scripts/windows-smoke.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Windows-installer-smoke-evidence
          path: |
            windows-smoke.json
            windows-tray-diagnostics.json
          if-no-files-found: ignore
          retention-days: 14
