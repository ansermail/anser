name: Windows validation
on:
  push:
    branches: [main, codex/windows-support]
  pull_request:
  workflow_dispatch:
    inputs:
      installer_run_id:
        description: Existing installer artifact run ID for isolated smoke only
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    if: inputs.installer_run_id == ''
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:desktop
  native:
    if: inputs.installer_run_id == ''
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64
          cache-on-failure: true
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/vendor/imap-proto/Cargo.toml
      - name: Build Windows validation installer
        env:
          MAIL_GOOGLE_CLIENT_ID: ${{ github.event_name != 'pull_request' && secrets.MAIL_GOOGLE_CLIENT_ID || '' }}
          MAIL_GOOGLE_CLIENT_SECRET: ${{ github.event_name != 'pull_request' && secrets.MAIL_GOOGLE_CLIENT_SECRET || '' }}
          MAIL_MICROSOFT_CLIENT_ID: ${{ github.event_name != 'pull_request' && secrets.MAIL_MICROSOFT_CLIENT_ID || '' }}
        run: node scripts/windows-build.mjs
      - name: Upload Windows validation installer
        id: installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: Anser-Windows-x64-validation-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Install and start the WebView2 client
        run: ./scripts/windows-smoke.ps1
      - name: Upload Windows validation smoke report
        if: github.event_name != 'pull_request' && success()
        uses: actions/upload-artifact@v6
        with:
          name: Anser-Windows-x64-validation-report
          path: windows-smoke.json
          if-no-files-found: error
          retention-days: 14
  smoke:
    if: inputs.installer_run_id != ''
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8.0.1
        with:
          name: Anser-Windows-x64-validation-installer
          run-id: ${{ inputs.installer_run_id }}
          github-token: ${{ github.token }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
      - run: ./scripts/windows-smoke.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Windows-installer-smoke-evidence
          path: |
            windows-smoke.json
            windows-tray-diagnostics.json
          if-no-files-found: ignore
          retention-days: 14
